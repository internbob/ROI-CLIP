# P2: MRI + clean clinical privileged Teacher. Development folds only.
# train_teacher.py must be called with --disable_roi_branch so the CLI does
# not replace model.use_roi_branch=false with its legacy default.
experiment_name: "CortexBridge-P2-Clinical-Privileged-Teacher"

data:
  split_root: "/home_data/home/zhouwl2023/project/Cortexbridge/cortexweave_roiclip/lookupcsv-full-huashan-adni-teacher-clean"
  allowed_subject_prefixes: ["sub-ADNI"]
  clinical:
    enabled: true
    features: &safe_clinical_features
      - age
      - education
      - apoe
      - gds
      - npiq_DEL
      - npiq_HALL
      - npiq_AGIT
      - npiq_DEPD
      - npiq_ANX
      - npiq_ELAT
      - npiq_APA
      - npiq_DISN
      - npiq_IRR
      - npiq_MOT
      - npiq_NITE
      - npiq_APP
  mri_aug:
    prob: 0.5
    max_voxel_shift: 0
    intensity_scale: 0.1
    intensity_shift: 0.05
    gamma: 0.1
    noise_std: 0.01

model:
  method: "cortexbridge-p2-clinical-privileged-teacher"
  use_roi_branch: false
  use_clinical: true
  student_use_clinical: false
  clinical_fusion_mode: "gated"
  volume_pooling:
    mode: "legacy_mask"
  cross_geometry:
    enabled: false
    lambda_cg: 0.0
  roi_graph:
    enabled: false

training:
  num_folds: 3
  epochs: 30
  early_stop_patience: 4
  seed: 3407
  selection_metric: "mcc"
  class_weight_mode: "sqrt_balanced"
  ce_warmup_epochs: 5

runtime:
  evaluate_test: false
