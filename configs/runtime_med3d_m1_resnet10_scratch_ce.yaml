# M1: architecture control for the Med3D experiment. Same ResNet10 adapter as
# M2-M4, but randomly initialized and trained with CE only.
experiment_name: "CortexBridge-Med3D-M1-ResNet10-Scratch-CE"

model:
  student_backbone:
    name: "medicalnet_resnet10"
    pretrained_path: ""
    freeze_bn_stats: false

training:
  vnext_graph_student: true
  match_teacher_available: true
  initialize_from_teacher: false
  warmup_epochs: 0
  encoder_lr: 0.0001
  inherited_lr: 0.0001

loss_weights:
  vnext_kd_logit: 0.0
  vnext_kd_roi: 0.0
  vnext_kd_graph: 0.0
  vnext_kd_prototype: 0.0

runtime:
  evaluate_test: false
