# P3: joint MRI + surface/ribbon geometry + clean clinical privileged Teacher.
experiment_name: "CortexBridge-P3-Joint-Privileged-Teacher"

data:
  split_root: "/home_data/home/zhouwl2023/project/Cortexbridge/cortexweave_roiclip/lookupcsv-full-huashan-adni-teacher-clean"
  allowed_subject_prefixes: ["sub-ADNI"]
  clinical:
    enabled: true
    features:
      - age
      - education
      - apoe
      - gds
      - npiq_DEL
      - npiq_HALL
      - npiq_AGIT
      - npiq_DEPD
      - npiq_ANX
      - npiq_ELAT
      - npiq_APA
      - npiq_DISN
      - npiq_IRR
      - npiq_MOT
      - npiq_NITE
      - npiq_APP
  mri_aug:
    prob: 0.5
    max_voxel_shift: 0
    intensity_scale: 0.1
    intensity_shift: 0.05
    gamma: 0.1
    noise_std: 0.01

model:
  method: "cortexbridge-p3-joint-privileged-teacher"
  use_roi_branch: true
  use_clinical: true
  student_use_clinical: false
  clinical_fusion_mode: "gated"
  volume_pooling:
    mode: "legacy_mask"
  ribbon:
    num_depths: 5
    depths: [0.2, 0.35, 0.5, 0.65, 0.8]
    depth_attention: false
    feature_stage: "roi"
  cross_geometry:
    enabled: true
    feature_stage: "high_res"
    projection_dim: 128
    temperature: 0.1
    lambda_cg: 0.01
    topology_metric_topk: 3
  roi_graph:
    enabled: true
    topology_path: "/home_data/home/zhouwl2023/project/Cortexbridge/cortexweave_roiclip/outputs/vnext_phase2_1_5_20261003/true_dkt_topology.npz"
    num_layers: 1
    num_heads: 4
    dropout: 0.1
    residual_gate_init: 0.1
    use_boundary_strength: true
    use_homology: true
    shuffle_topology_bias: false

training:
  num_folds: 3
  epochs: 30
  early_stop_patience: 4
  seed: 3407
  selection_metric: "mcc"
  class_weight_mode: "sqrt_balanced"
  ce_warmup_epochs: 5

runtime:
  evaluate_test: false
